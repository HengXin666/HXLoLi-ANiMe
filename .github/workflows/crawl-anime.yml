name: 🕷️ 定时爬取番剧数据

on:
  schedule:
    # 每天 UTC 18:00 (北京时间凌晨 2:00) 执行
    - cron: '0 18 * * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

jobs:
  crawl:
    name: 爬取 Bangumi 番剧数据
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安装 uv 及依赖
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          source $HOME/.cargo/env
          uv sync
        working-directory: ./scripts/crawler

      - name: 🕷️ 运行爬虫
        env:
          BGM_TOKEN: ${{ secrets.BGM_TOKEN }}
          BGM_USERNAME: ${{ secrets.BGM_USERNAME }}
        run: |
          source $HOME/.cargo/env
          uv run Api.py -u "${BGM_USERNAME:-heng_xin}" -o "${BGM_TOKEN}"
        working-directory: ./scripts/crawler

      - name: 📊 检查数据变化
        id: changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "📭 没有数据变化"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"

            # 统计变化
            CHANGED_FILES=$(git diff --cached --name-only)
            NEW_IMAGES=$(echo "${CHANGED_FILES}" | grep '\.jpg$' | wc -l || true)
            JSON_CHANGED=$(echo "${CHANGED_FILES}" | grep '\.json$' | wc -l || true)

            echo "new_images=${NEW_IMAGES}" >> "$GITHUB_OUTPUT"
            echo "json_changed=${JSON_CHANGED}" >> "$GITHUB_OUTPUT"
            echo "📬 检测到变化: ${JSON_CHANGED} JSON, ${NEW_IMAGES} 图片"
          fi

      - name: 💾 提交更新
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Heng_Xin[LoLi-Bot]"
          git config user.email "282000500@qq.com"
          git commit -m "[LoLi-Bot]: ご主人さま、アニメデータを更新しましたにゃ ($(date +%Y-%m-%d))"
          git push
          echo "✅ 数据已提交, cdn-tag.yml 将自动触发"
