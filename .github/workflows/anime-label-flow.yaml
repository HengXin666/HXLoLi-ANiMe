name: "[LoLi-ANiMe]: 标注流 (标注 PR / 勾选解析 / bgm 同步 / 一个月自动关闭)"

# ─────────────────────────────────────────────────────
# 依据 hx-anime-tag-refactor-design.md 第 5.2, 6, 7, 8, 9 节 (路4).
#
# 触发:
#   1. workflow_run   data 流 (爬虫) 合入成功后 → 读取 events.json → 每个事件开/更新一个标注 PR
#                     (分支 label/<id>, 草稿 data/labels/<id>.json, tags 为空; 正文带封面 CDN 图)
#   2. 勾标签 (在 PR 正文点勾选 / 编辑正文) 全程不触发任何工作流 (已不再监听 edited).
#      issue_comment created        /tag /untag /rate /review /done /skip /nobgm (/resync /reopen) 作为等价入口
#   3. 最终确认: 给 PR 打 label「state:待合入」(pull_request_target labeled) 或评论 /done → 只跑一次 handle:
#      一次性解析正文勾选 → 写回草稿 → 自动 squash 合入 → 同一 job 内跑 label-sync-bgm (bgm api + BGM_TOKEN)
#      其它 label (flow:label / state:等待标注 / mode:* / susume:* / bgm:*) 的 labeled 事件一律不跑.
#      pull_request_target closed(merged) 兜底: 人工直接点 Merge 时补齐并同步
#   4. 过期扫描: 定时入口在 anime-label-expire.yaml; 本文件只保留 workflow_dispatch action=expire
#
# 安全: pull_request_target / issue_comment 只 checkout 默认分支上的脚本, 绝不执行 PR 分支代码;
#       只有仓库写权限用户的勾选/指令生效.
# 防回环: 全部写操作用 GITHUB_TOKEN (GitHub 不会因此再触发工作流); data 流不碰 data/labels/,
#         本流只写 data/labels/, 主站只读 data/labels/.
# 前置: 仓库 Settings → Actions → 允许 GitHub Actions 创建 PR; secrets.BGM_TOKEN (收藏写权限);
#       data/labelVocab.json (唯一词表) 已在 main 上.
# ─────────────────────────────────────────────────────

on:
  workflow_run:
    # 方括号必须转义: workflows 按 glob 解析, 原样写 "[LoLi-ANiMe]" 会被当成字符类, 匹配不上
    # 上游 name, 触发解析失败 (每次任意 workflow 完成刷一条 startup_failure 幽灵 run, 本 workflow
    # 却从不触发). 门禁: scripts/ci/check_workflow_run_refs.py
    workflows: ['\[LoLi-ANiMe\]: 爬取番剧数据 & CDN Tag']
    types: [completed]
    branches: [main]
  pull_request_target:
    types: [labeled, closed]
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  # 过期扫描的定时入口只保留在 anime-label-expire.yaml (UTC 03:17), 此处不再 schedule;
  # 手动 expire 仍走下面的 workflow_dispatch.
  workflow_dispatch:
    inputs:
      action:
        description: 'open = 手动开标注 PR, backfill = 全量回填所有未标注番剧, expire = 扫描过期, resync = 重新同步 bgm, build-index = 重建 index.json 汇总'
        type: choice
        options: [open, backfill, expire, resync, build-index]
        default: open
      ids:
        description: 'open 用: bgm subject id, 空格分隔'
        required: false
      chunk:
        description: 'backfill 用: 每个批量 PR 最多列几部 (默认 20)'
        required: false
        default: '20'
      mode:
        description: 'open 用: new = 标注, review = 观后感'
        type: choice
        options: [new, review]
        default: new
      pr:
        description: 'resync 用: 标注 PR 号'
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  # 同一个标注 PR 的勾选/评论串行处理, 避免草稿互相覆盖;
  # workflow_run / dispatch 等无 PR 号的事件用 github.run_id 各自成组, 不合并,
  # 避免新 pending 取消旧 pending 把真正爬取 success 触发的 open run 顶掉.
  group: anime-label-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

env:
  ANIME_DIR: .
  LABEL_BASE_BRANCH: main
  LABEL_EXPIRE_DAYS: '30'
  LABEL_REMIND_DAYS: '25'
  ANIME_CDN_BASE: https://cdn.jsdelivr.net/gh

jobs:
  # ══════════════════════════════════════
  # -1) 全量回填: 清空旧 tag 后, 手动把所有未标注番剧摊成批量标注 PR 供人工逐部勾选
  # ══════════════════════════════════════
  backfill:
    name: 全量回填 (所有未标注番剧)
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'backfill'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: 📋 列出并摊开所有未标注番剧
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LABEL_REPORT: label-backfill-report.json
        run: python3 scripts/label-flow.py backfill --chunk "${{ inputs.chunk || '20' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: label-backfill-report
          path: label-backfill-report.json
          if-no-files-found: warn
          retention-days: 7

  # ══════════════════════════════════════
  # 0) issue 表单备用入口: 用户主动提交"标注番剧" issue, bot 代开标注 PR 并 Closes #n
  # ══════════════════════════════════════
  issue:
    name: issue 代开标注 PR
    if: >-
      github.event_name == 'issues' &&
      contains(github.event.issue.labels.*.name, 'flow:label')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: 🏷️ 由 issue 开标注 PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LABEL_REPORT: label-issue-report.json
        run: python3 scripts/label-flow.py issue --issue "${{ github.event.issue.number }}"
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: label-issue-report
          path: label-issue-report.json
          if-no-files-found: warn
          retention-days: 7

  # ══════════════════════════════════════
  # A) data 流合入后: 每个事件开 (或更新/升级) 一个标注 PR
  # ══════════════════════════════════════
  open:
    name: 开标注 PR
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'open')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: 📥 下载 data 流的 events.json (artifact anime-events)
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: anime-events
          path: .label-events
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: 🏷️ 取最新 CDN Tag (封面走 CDN tag 地址)
        id: cdn
        run: |
          TAG=$(git tag -l 'HX-*' --sort=-creatordate | head -n 1)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "📌 CDN tag: ${TAG:-<无, 退回 main>}"

      - name: 🏷️ 开 / 更新标注 PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANIME_CDN_TAG: ${{ steps.cdn.outputs.tag }}
          LABEL_REPORT: label-open-report.json
          IDS: ${{ inputs.ids }}
          MODE: ${{ inputs.mode || 'new' }}
        run: |
          python3 scripts/label-flow.py open \
            --events .label-events/events.json \
            --events data/events.json \
            --ids "${IDS}" --mode "${MODE}"

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: label-open-report
          path: label-open-report.json
          if-no-files-found: warn
          retention-days: 7

  # ══════════════════════════════════════
  # B) 勾选 / 评论指令 → 写回草稿 → 置顶"当前结果"评论 → 完成即合入 → C) bgm 同步
  # ══════════════════════════════════════
  handle:
    name: 解析勾选 / 指令
    # 勾标签 (编辑 PR 正文) 不触发; 只有最终确认才跑一次:
    # labeled: 仅当被加上的 label 是「state:待合入」时跑, 其它 label 的 labeled 事件不跑;
    #          sender 限定为仓库 owner (labeled 载荷里没有 sender 的 author_association,
    #          pull_request.author_association 是 PR 作者即 bot, 不能用来判断 sender).
    # issue_comment: 等价入口 (/done 等), 评论者 author_association 必须是 OWNER / MEMBER / COLLABORATOR.
    # 两者都排除 Bot.
    if: >-
      (github.event_name == 'pull_request_target' && github.event.action == 'labeled' &&
       github.event.label.name == 'state:待合入' &&
       contains(github.event.pull_request.labels.*.name, 'flow:label') &&
       github.event.sender.type != 'Bot' &&
       github.event.sender.login == github.repository_owner) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       contains(github.event.issue.labels.*.name, 'flow:label') &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - id: cdn
        run: echo "tag=$(git tag -l 'HX-*' --sort=-creatordate | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: ✍️ 写回标注草稿
        id: handle
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANIME_CDN_TAG: ${{ steps.cdn.outputs.tag }}
          LABEL_REPORT: label-handle-report.json
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: python3 scripts/label-flow.py handle --pr "${PR_NUMBER}"

      - name: 🔄 同步到 bgm (label-sync-bgm)
        if: steps.handle.outputs.merged == 'true' || steps.handle.outputs.resync == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BGM_TOKEN: ${{ secrets.BGM_TOKEN }}
          BGM_USERNAME: ${{ secrets.BGM_USERNAME }}
          LABEL_REPORT: label-sync-bgm-report.json
        run: python3 scripts/label-sync-bgm.py --pr "${{ steps.handle.outputs.pr }}"

      # 标注合入 main 后重建 data/labels/index.json 汇总. 主站优先读它, 一次请求拿全量,
      # 不再依赖恒 403 的 jsDelivr 目录列表 (包 >50MB) 与 60 次/小时/IP 的 GitHub contents API.
      # 用 github.token 写本仓; GITHUB_TOKEN 的提交不会触发下游 workflow, 符合防回环约定.
      # !cancelled(): bgm 同步失败也照常重建. merged 为 false (没真正合入) 时不跑.
      - name: 🧾 重建标注汇总 index.json
        if: ${{ !cancelled() && steps.handle.outputs.merged == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LABEL_REPORT: label-build-index-report.json
        run: python3 scripts/label-flow.py build-index

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: label-handle-report
          path: |
            label-handle-report.json
            label-sync-bgm-report.json
            label-build-index-report.json
          if-no-files-found: warn
          retention-days: 7

  # ══════════════════════════════════════
  # C) 兜底: 人工直接 Merge 的标注 PR / 手动 resync → bgm 同步
  #    (bot 用 GITHUB_TOKEN 合入不会触发 closed 事件, 不会与 handle 重复同步)
  # ══════════════════════════════════════
  label-sync-bgm:
    name: 合入后同步 bgm
    if: >-
      (github.event_name == 'pull_request_target' && github.event.action == 'closed' &&
       github.event.pull_request.merged &&
       contains(github.event.pull_request.labels.*.name, 'flow:label')) ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'resync')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: 🧾 补齐 by / labeledAt / label
        id: post
        if: github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LABEL_REPORT: label-post-merge-report.json
        run: python3 scripts/label-flow.py post-merge --pr "${{ github.event.pull_request.number }}"

      - name: 🔄 同步到 bgm
        if: steps.post.outputs.merged == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BGM_TOKEN: ${{ secrets.BGM_TOKEN }}
          BGM_USERNAME: ${{ secrets.BGM_USERNAME }}
          LABEL_REPORT: label-sync-bgm-report.json
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: python3 scripts/label-sync-bgm.py --pr "${PR_NUMBER}"

      # 人工直接 Merge 的标注 PR 也要重建汇总, 否则主站读到的 index.json 会漏掉这次合入.
      - name: 🧾 重建标注汇总 index.json
        if: ${{ !cancelled() && (steps.post.outputs.merged == 'true' || github.event_name == 'workflow_dispatch') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LABEL_REPORT: label-build-index-report.json
        run: python3 scripts/label-flow.py build-index

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: label-sync-bgm-report
          path: |
            label-post-merge-report.json
            label-sync-bgm-report.json
            label-build-index-report.json
          if-no-files-found: warn
          retention-days: 7

  # ══════════════════════════════════════
  # D) 一个月自动关闭 (手动入口; 定时见 anime-label-expire.yaml): 创建时间 / 最后一次用户交互 较晚者起算
  #    满 30 天: 评论 + 关闭 + 删分支 + state:expired, 不写标注文件; 第 25 天提醒一次
  # ══════════════════════════════════════
  expire:
    name: 过期扫描 (手动)
    # 定时扫描只由 anime-label-expire.yaml 负责, 这里仅保留手动入口
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'expire'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: ⌛ 关闭满一个月未标注的 PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LABEL_REPORT: label-expire-report.json
        run: python3 scripts/label-flow.py expire

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: label-expire-report
          path: label-expire-report.json
          if-no-files-found: warn
          retention-days: 7

  # ══════════════════════════════════════
  # E) 手动重建标注汇总 (index.json 落后 / 首次生成 / 排查时用)
  #    只读 main 上逐文件标注, 内容未变则不提交, 随时可重跑.
  # ══════════════════════════════════════
  build-index:
    name: 重建标注汇总 index.json (手动)
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'build-index'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: 🧾 重建 data/labels/index.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LABEL_REPORT: label-build-index-report.json
        run: python3 scripts/label-flow.py build-index

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: label-build-index-report
          path: label-build-index-report.json
          if-no-files-found: warn
          retention-days: 7
